<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV - Diomidis Anadiotis</title>
    <meta name="description" content="Experience and skills of Diomidis Anadiotis, a London-based senior software engineer building event-driven .NET microservices on Azure." />
    <link rel="canonical" href="https://diomidis.net/cv/" />

    <meta
      name="theme-color"
      content="#f9fafb"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#111827"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Apply the stored or system theme before first paint; mirrors useDarkMode -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("darkMode");
          var isDark =
            stored !== null
              ? JSON.parse(stored)
              : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (isDark) document.documentElement.classList.add("dark");
          var themeColor = isDark ? "#111827" : "#f9fafb";
          document
            .querySelectorAll('meta[name="theme-color"]')
            .forEach(function (meta) {
              meta.setAttribute("content", themeColor);
            });
        } catch (e) {}
      })();
    </script>
