    <!-- Apply the saved or system theme before first paint to avoid a light-theme flash -->
    <script>
      try {
        const stored = localStorage.getItem('darkMode');
        if (stored === 'true' || (stored === null && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch {}
    </script>
